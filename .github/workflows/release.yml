name: Release

# Tag-driven, reproducible releases for OriginLabs1/OriginStudio.
#
#   git tag v0.0.1 && git push origin v0.0.1
#
# The pipeline refuses to publish an unsigned APK. It builds from the tagged commit, signs with
# the OriginLabs1 release key, verifies the signature, writes SHA-256 checksums and a release
# manifest, and publishes everything to GitHub Releases so Obtainium can track it.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (for example 0.0.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, verify, publish
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      TERMFOLD_STORE_PASSWORD: ${{ secrets.TERMFOLD_STORE_PASSWORD }}
      TERMFOLD_KEY_PASSWORD: ${{ secrets.TERMFOLD_KEY_PASSWORD }}

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive version from tag
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          VERSION="${VERSION#v}"

          # Stable semver only. A tag must be vX.Y.Z so versionCode stays monotonic and
          # Obtainium can treat every published release as an update.
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '${VERSION}' must be stable semver (major.minor.patch)."
            exit 1
          fi

          CORE="${VERSION}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${CORE}"
          # Two-digit minor and patch keep the encoding unambiguous, so no two versions can
          # ever produce the same versionCode.
          if [ "${MINOR}" -gt 99 ] || [ "${PATCH}" -gt 99 ]; then
            echo "::error::Minor and patch must be 0-99 so versionCode stays unique."
            exit 1
          fi
          VERSION_CODE=$((10#${MAJOR} * 10000 + 10#${MINOR} * 100 + 10#${PATCH}))
          if [ "${VERSION_CODE}" -lt 1 ] || [ "${VERSION_CODE}" -gt 2100000000 ]; then
            echo "::error::Computed versionCode ${VERSION_CODE} is outside Android's accepted range."
            exit 1
          fi

          echo "name=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "code=${VERSION_CODE}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Building Origin Studio ${VERSION} (versionCode ${VERSION_CODE})"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          # GitHub's ubuntu runner already ships the Android SDK. Use it directly instead of a
          # third-party action that tries to install the retired "tools" package.
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "${ANDROID_HOME}" ]; then
            ANDROID_HOME="/usr/local/lib/android/sdk"
            {
              echo "ANDROID_HOME=${ANDROID_HOME}"
              echo "ANDROID_SDK_ROOT=${ANDROID_HOME}"
            } >> "${GITHUB_ENV}"
          fi

          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "${SDKMANAGER}"
          yes | "${SDKMANAGER}" --licenses > /dev/null || true
          "${SDKMANAGER}" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          ls "${ANDROID_HOME}/platforms" "${ANDROID_HOME}/build-tools"

      - name: Set up Python for asset staging
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node for the universal layer
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Rust for the core CLI
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install the ARM64 cross linker
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu

      - name: Install asset tooling
        shell: bash
        run: python -m pip install --upgrade zstandard

      - name: Stage Linux runtime and CA bundle
        shell: bash
        run: |
          set -euo pipefail
          python tools/fetch-shell-runtime.py
          python tools/fetch-ca-bundle.py

      - name: Run unit tests
        shell: bash
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Test the Rust core
        shell: bash
        run: cargo test --locked --manifest-path rust/origin-core/Cargo.toml

      - name: Test the universal layer
        shell: bash
        run: |
          set -euo pipefail
          node --test cli/test/*.test.mjs hosts/hub/test/*.test.js
          node tools/validate-contracts.mjs
          node tools/check-companion.mjs
          node tools/check-evidence.mjs

      - name: Require signing key
        shell: bash
        env:
          ORIGIN_KEYSTORE_BASE64: ${{ secrets.ORIGIN_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ORIGIN_KEYSTORE_BASE64}" ]; then
            echo "::error::ORIGIN_KEYSTORE_BASE64 is not configured. Refusing to build an unsigned release."
            exit 1
          fi
          if [ -z "${TERMFOLD_STORE_PASSWORD}" ]; then
            echo "::error::TERMFOLD_STORE_PASSWORD is not configured. Refusing to build an unsigned release."
            exit 1
          fi
          printf '%s' "${ORIGIN_KEYSTORE_BASE64}" | base64 --decode > termfold-release.jks
          test -s termfold-release.jks

      - name: Build signed release APK
        shell: bash
        env:
          ORIGIN_VERSION_NAME: ${{ steps.version.outputs.name }}
          ORIGIN_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify signature and record certificate
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/OriginStudio-release.apk"
          test -f "${APK}"

          # Use exactly the build-tools the app is built with. The runner image also ships
          # newer preview build-tools, and picking the highest one made apksigner reject an
          # APK that is valid for this app's pinned toolchain.
          APKSIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          test -x "${APKSIGNER}"
          "${APKSIGNER}" version

          # apksigner exits non-zero if the APK is unsigned or the signature is invalid, which
          # fails the job before anything can be published. Tee the report so a failure is
          # visible in the job log instead of hidden inside an artifact.
          set +e
          "${APKSIGNER}" verify --verbose --print-certs "${APK}" 2>&1 | tee signing-certificate.txt
          VERIFY_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "${VERIFY_STATUS}" -ne 0 ]; then
            echo "::error::apksigner could not verify the APK (exit ${VERIFY_STATUS}). Refusing to publish."
            exit "${VERIFY_STATUS}"
          fi

          grep -q "Number of signers: 1" signing-certificate.txt
          # apksigner renamed this line from "Signer #1 certificate SHA-256 digest" to
          # "V2 Signer: certificate SHA-256 digest" in build-tools 36.1, so accept both.
          CERT_SHA256="$(grep -m 1 -E '(^Signer #1 certificate SHA-256 digest:|V2 Signer: certificate SHA-256 digest:)' signing-certificate.txt | sed 's/.*digest: *//' | tr -d '[:space:]')"
          if ! [[ "${CERT_SHA256}" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::Could not read the signing certificate SHA-256 digest."
            exit 1
          fi

          echo "cert_sha256=${CERT_SHA256,,}" >> "${GITHUB_OUTPUT}"
          echo "Signed and verified. Certificate SHA-256: ${CERT_SHA256}"

      - name: Build the Rust core CLI
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.name }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          set -euo pipefail
          MANIFEST="rust/origin-core/Cargo.toml"
          cargo build --locked --release --manifest-path "${MANIFEST}"
          cargo build --locked --release --target aarch64-unknown-linux-gnu --manifest-path "${MANIFEST}"

          STAGE="build/core-stage"
          rm -rf "${STAGE}"
          mkdir -p "${STAGE}/x86_64" "${STAGE}/aarch64" release
          cp rust/origin-core/target/release/origin-core "${STAGE}/x86_64/"
          cp rust/origin-core/target/aarch64-unknown-linux-gnu/release/origin-core "${STAGE}/aarch64/"
          cp LICENSE "${STAGE}/x86_64/"
          cp LICENSE "${STAGE}/aarch64/"

          # The same answers from a terminal, no JVM and no Node: one static binary per arch.
          tar -czf "release/origin-core-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            -C "${STAGE}/x86_64" origin-core LICENSE
          tar -czf "release/origin-core-${VERSION}-aarch64-unknown-linux-gnu.tar.gz" \
            -C "${STAGE}/aarch64" origin-core LICENSE

          # Run the host binary from the archive exactly as a user would. The ARM64 build is
          # checked for its architecture instead: this runner cannot execute it natively.
          mkdir -p build/core-check
          tar -xzf "release/origin-core-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" -C build/core-check
          build/core-check/origin-core fingerprint
          rm -rf build/core-check
          file "${STAGE}/aarch64/origin-core" | grep -q "aarch64"

      - name: Assemble release artifacts
        id: artifacts
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          TAG: ${{ steps.version.outputs.tag }}
          CERT_SHA256: ${{ steps.signing.outputs.cert_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p release
          APK="app/build/outputs/apk/release/OriginStudio-release.apk"
          ASSET="release/OriginStudio-${VERSION}.apk"
          cp "${APK}" "${ASSET}"

          SHA256="$(sha256sum "${ASSET}" | awk '{print $1}')"
          printf '%s  %s\n' "${SHA256}" "$(basename "${ASSET}")" > "release/OriginStudio-${VERSION}.apk.sha256"
          cp signing-certificate.txt "release/signing-certificate.txt"

          # The universal layer ships beside the app: a zero-build web app, a dependency-free
          # CLI, and an SBOM. None of them needs a server or an account.
          (cd companion && zip -q -r "../release/OriginCompanion-${VERSION}.zip" .)
          npm pack --pack-destination release --silent > /dev/null
          mv "release/originlabs-origin-${VERSION}.tgz" "release/origin-cli-${VERSION}.tgz"
          node tools/make-sbom.mjs "release/OriginStudio-${VERSION}.sbom.cdx.json"

          COMPANION_SHA256="$(sha256sum "release/OriginCompanion-${VERSION}.zip" | awk '{print $1}')"
          CLI_SHA256="$(sha256sum "release/origin-cli-${VERSION}.tgz" | awk '{print $1}')"
          SBOM_SHA256="$(sha256sum "release/OriginStudio-${VERSION}.sbom.cdx.json" | awk '{print $1}')"
          CORE_X86="origin-core-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          CORE_ARM="origin-core-${VERSION}-aarch64-unknown-linux-gnu.tar.gz"
          CORE_X86_SHA256="$(sha256sum "release/${CORE_X86}" | awk '{print $1}')"
          CORE_ARM_SHA256="$(sha256sum "release/${CORE_ARM}" | awk '{print $1}')"

          cat > release/release-manifest.json <<EOF
          {
            "product": "Origin Studio",
            "package": "com.oneorigin.studio",
            "versionName": "${VERSION}",
            "versionCode": ${VERSION_CODE},
            "tag": "${TAG}",
            "commit": "${GITHUB_SHA}",
            "buildDateUtc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "apk": "$(basename "${ASSET}")",
            "apkSizeBytes": $(stat -c %s "${ASSET}"),
            "apkSha256": "${SHA256}",
            "signingCertificateSha256": "${CERT_SHA256}",
            "minSdk": 26,
            "targetSdk": 28,
            "compileSdk": 36,
            "supportedAbis": ["arm64-v8a", "x86_64"],
            "universal": {
              "companion": "OriginCompanion-${VERSION}.zip",
              "companionSha256": "${COMPANION_SHA256}",
              "cli": "origin-cli-${VERSION}.tgz",
              "cliSha256": "${CLI_SHA256}",
              "npx": "npx github:OriginLabs1/OriginStudio",
              "sbom": "OriginStudio-${VERSION}.sbom.cdx.json",
              "sbomSha256": "${SBOM_SHA256}",
              "rustCore": {
                "x86_64": "${CORE_X86}",
                "x86_64Sha256": "${CORE_X86_SHA256}",
                "aarch64": "${CORE_ARM}",
                "aarch64Sha256": "${CORE_ARM_SHA256}"
              }
            },
            "distribution": {
              "canonical": "https://github.com/OriginLabs1/OriginStudio/releases",
              "obtainium": "https://apps.obtainium.imranr.dev/redirect?r=obtainium://add/https://github.com/OriginLabs1/OriginStudio"
            }
          }
          EOF

          # Keep the manifest and checksum consistent and easy to verify offline.
          (cd release && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS)

          echo "apk=${ASSET}" >> "${GITHUB_OUTPUT}"
          echo "sha256=${SHA256}" >> "${GITHUB_OUTPUT}"
          cat release/OriginStudio-${VERSION}.apk.sha256
          cat release/SHA256SUMS

      - name: Write release notes
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          SHA256: ${{ steps.artifacts.outputs.sha256 }}
          CERT_SHA256: ${{ steps.signing.outputs.cert_sha256 }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          ## Origin Studio ${VERSION}

          Built from tag \`v${VERSION}\` at commit \`${GITHUB_SHA}\`. versionCode ${VERSION_CODE}.

          ### Install

          1. Download \`OriginStudio-${VERSION}.apk\` below and open it.
          2. Or add \`github.com/OriginLabs1/OriginStudio\` to [Obtainium](https://github.com/ImranR98/Obtainium) for automatic updates.
          3. Allow installs from your browser or file manager when Android asks.

          ### Universal companion and CLI

          The same workspace works without the app:

          - **Companion:** unzip \`OriginCompanion-${VERSION}.zip\` anywhere static, or open it
            from the host at its own address. No build step, no account.
          - **CLI:** \`tar -xzf origin-cli-${VERSION}.tgz\` then \`node package/cli/origin.mjs doctor\`.
            Or \`npx github:OriginLabs1/OriginStudio doctor\`.
          - **Rust core:** \`tar -xzf origin-core-${VERSION}-x86_64-unknown-linux-gnu.tar.gz\`
            (or the \`aarch64\` archive), then \`./origin-core environments\`. No JVM, Node or
            network required.

          See \`docs/universal.md\` for the full workflow.

          ### Verify

          SHA-256  ${SHA256}

          The APK is signed with the OriginLabs1 release key. Signing certificate SHA-256:

          \`\`\`
          ${CERT_SHA256}
          \`\`\`

          Compare the checksum with \`OriginStudio-${VERSION}.apk.sha256\` and the certificate with
          \`signing-certificate.txt\`. Every artifact is listed in \`SHA256SUMS\`, described in
          \`release-manifest.json\`, and inventoried in
          \`OriginStudio-${VERSION}.sbom.cdx.json\`.

          ### Requirements and known limitations

          - Android 8.0+ (API 26+). The Linux environment targets API 28 for PRoot execution.
          - 64-bit ARM (arm64-v8a) or x86_64 device.
          - 4 GB RAM recommended; several GB of free storage for Debian and developer tools.
          - First launch unpacks Debian and downloads developer tools, so an internet connection is needed once.
          - PRoot, not a virtual machine: no systemd, no kernel modules, no raw sockets.
          - Bring your own account or API key for each external coding agent.
          - Not on Google Play. Distributed through GitHub Releases and Obtainium.
          - The bundled local-AI runtime was removed in v0.0.9 to keep the APK lightweight.
            Local AI returns when the Ask/Explain/Fix surface ships; the workspace and every
            agent path work without it.
          EOF

          # Per-version notes live next to the source they describe, so the release record is
          # reviewable in the repository before the tag exists.
          VERSION_NOTES="docs/releases/v${VERSION}.md"
          if [ -f "${VERSION_NOTES}" ]; then
            printf '\n### What changed in v%s\n\n' "${VERSION}" >> release-notes.md
            cat "${VERSION_NOTES}" >> release-notes.md
            printf '\n' >> release-notes.md
          fi

          cat >> release-notes.md <<'EOF'
          ### Distribution

          GitHub Releases is the canonical source. Obtainium, the website and any mirror must
          resolve to these artifacts and never re-sign or silently modify them.
          EOF

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OriginStudio-${{ steps.version.outputs.name }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "::error::Release ${TAG} already exists. Bump the version instead of reusing a tag."
            exit 1
          fi

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Origin Studio ${VERSION}" \
              --notes-file release-notes.md \
              release/*
          else
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "Origin Studio ${VERSION}" \
              --notes-file release-notes.md \
              release/*
          fi

      - name: Clean up signing key
        if: always()
        shell: bash
        run: |
          rm -f termfold-release.jks
          rm -rf "${RUNNER_TEMP:?}/"*
